[workspace]
resolver = "2"
members = [
    "crates/mnem-core",
    "crates/mnem-cli",
    "crates/mnem-py",
]

[workspace.package]
version = "0.0.2"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/Nabzx/mnemosyne"
authors = ["Nabil Shah <nabilshahx@gmail.com>"]

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# A few restriction lints that should never fire in this codebase.
todo = "warn"
dbg_macro = "warn"
unimplemented = "warn"
mem_forget = "warn"

[workspace.dependencies]
mnem-core = { path = "crates/mnem-core", version = "0.0.2" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# storage and encoding, per ADR-0002, ADR-0005, ADR-0008. Not wired into a
# crate until the Phase 1 build tickets (#22 onward).
redb = "2"
ciborium = "0.2"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
