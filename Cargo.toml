[workspace]
resolver = "2"
members = [
    "crates/mnem-core",
    "crates/mnem-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/Nabzx/mnemosyne"
authors = ["Nabil Shah <nabilshahx@gmail.com>"]

[workspace.dependencies]
mnem-core = { path = "crates/mnem-core", version = "0.0.1" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
