name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (fmt, clippy, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned, not `stable`, so `fmt` and `clippy` are reproducible against a
      # local toolchain. Bump this deliberately.
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --all --check
      # clippy checks every crate, `mnem-py` included: it is check-only, no link.
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # `mnem-py` is a Python extension module; its test binary would need
      # libpython to link, and the wheel is maturin's job (see the python job
      # and #33). The pure-Rust crates carry the behaviour tests (ADR-0004).
      - run: cargo test --workspace --exclude mnem-py
      - run: cargo build --workspace --exclude mnem-py --release

  windows:
    name: rust (windows test, build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # No fmt/clippy here, those are platform-independent; this job exists
      # to catch a real Windows incompatibility (path handling, redb's file
      # locking) before #173 ships a Windows binary.
      - run: cargo test --workspace --exclude mnem-py
      - run: cargo build --workspace --exclude mnem-py --release

  windows-python:
    name: windows (python bindings)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      # ruff is platform-independent and already runs in the `python` job;
      # this exists to actually build and import the extension on Windows
      # before a real Windows wheel ships to PyPI on release (#212).
      - run: uv venv
      - run: uv pip install -e ".[dev]"
      - run: uv run pytest python/tests -q
      - run: uv pip install -e "./packages/mnem-mcp[dev]" -e "./packages/mnem-langgraph[dev]" -e "./packages/mnem-openai-agents[dev]" -e "./packages/mnem-autogen[dev]"
      # mnem-crewai isn't installed here (crewai's mcp~=1.2x pin conflicts
      # with mnem-mcp's own mcp>=2.2 floor in one venv, #310) and Windows
      # coverage for it is deferred until it has real logic worth testing
      # cross-platform - it's scaffolding-only right now. mnem-autogen has
      # no such conflict (#317), so it's covered here from day one.
      - run: uv run pytest packages/mnem-mcp packages/mnem-langgraph packages/mnem-openai-agents packages/mnem-autogen -q

  python:
    name: python (ruff, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      # Builds the mnem-py extension through maturin and installs it editable.
      - run: uv venv
      - run: uv pip install -e ".[dev]"
      - run: uv run ruff check python scripts
      - run: uv run pytest python/tests scripts -q

  benchmark:
    name: benchmark (overhead)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      # The correctness metrics run in the `rust` job (benchmark.rs is a test).
      # This is the overhead comparison against a dict and a JSONL baseline: it
      # asserts the audit-query table and the 2x regression gate (ADR-0017).
      - run: uv venv
      - run: uv pip install -e ".[dev]"
      - run: uv run ruff check benchmarks
      - run: uv run python benchmarks/overhead.py

  adapters:
    name: adapters (mcp, langgraph, openai-agents, autogen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      # The SDK (built through maturin), then each adapter package under
      # packages/ with its own deps. Adapters live outside the workspace and
      # test against the SDK (ADR-0004, ADR-0016).
      - run: uv venv
      - run: uv pip install -e ".[dev]"
      - run: uv pip install -e "./packages/mnem-mcp[dev]"
      - run: uv pip install -e "./packages/mnem-langgraph[dev]"
      - run: uv pip install -e "./packages/mnem-openai-agents[dev]"
      - run: uv pip install -e "./packages/mnem-autogen[dev,examples]"
      # ruff needs no installed deps to lint source on disk, so it covers
      # every package including mnem-crewai here; pytest does need real
      # imports, so mnem-crewai's own tests run in the adapters-crewai job
      # below instead - see that job for why it can't share this venv.
      # mnem-autogen's own deps (jsonref/opentelemetry-api/pillow/protobuf/
      # pydantic) don't conflict with anything already in this venv, so it
      # shares this job rather than needing its own isolated one (#317).
      - run: uv run ruff check packages examples
      - run: uv run pytest packages/mnem-mcp packages/mnem-langgraph packages/mnem-openai-agents packages/mnem-autogen -q
      # The worked examples double as end-to-end checks: each asserts its
      # outcome and exits non-zero on failure (#60).
      - run: uv run python examples/support_agent.py
      - run: uv run python examples/claude_agent.py
      - run: uv run python examples/langgraph_memory.py
      - run: uv run python examples/mcp_client.py
      - run: uv run python examples/openai_agents_memory.py
      - run: uv run python examples/autogen_memory.py

  adapters-crewai:
    name: adapters (crewai, cross-adapter ids)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      # A separate job, not one more install line in `adapters` above:
      # every crewai release with the StorageBackend protocol (1.10.1
      # through at least 1.15.23, checked directly) pins mcp~=1.2x, which
      # is incompatible with mnem-mcp's own mcp>=2.2 floor - the two
      # cannot share one venv (found the hard way, #310). mnem-mcp isn't
      # installed in this job at all, so langgraph/openai-agents/autogen
      # can join crewai here with no conflict - verified directly (#362) -
      # which is what the cross-adapter id-collision test below needs.
      # All four MUST install in one call: splitting crewai into its own
      # `uv pip install` before the other three (matching this job's own
      # previous two-line style) silently resolves an incompatible
      # protobuf gencode/runtime pair - found the hard way building this
      # very test, reproduced and fixed by combining the calls, not by
      # pinning protobuf by hand.
      - run: uv venv
      - run: uv pip install -e ".[dev]"
      - run: uv pip install -e "./packages/mnem-crewai[dev]" -e "./packages/mnem-langgraph[dev]" -e "./packages/mnem-openai-agents[dev]" -e "./packages/mnem-autogen[dev]"
      - run: uv run pytest packages/mnem-crewai tests -q
      # The worked example doubles as an end-to-end check (#60), same as
      # every other adapter's own example in the `adapters` job above.
      - run: uv run python examples/crewai_memory.py

  wheel:
    name: python (wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      # Build a real release wheel, the artefact a user installs (#33).
      - name: build the wheel
        run: uv run --with 'maturin>=1.7,<2' maturin build --release --out dist
      - name: the wheel bundles the extension and the type stubs
        run: |
          names() { uv run --no-project python -c "import sys,zipfile;print(chr(10).join(zipfile.ZipFile(sys.argv[1]).namelist()))" "$(echo dist/*.whl)"; }
          names
          names | grep -qE '^mnem/_mnem\.abi3\.so$'
          names | grep -qE '^mnem/_mnem\.pyi$'
          names | grep -qE '^mnem/py\.typed$'
      # Install into a clean environment and run the SDK tests from outside the
      # repo, so `import mnem` can only resolve to the installed wheel.
      - name: install the wheel and test the SDK against it
        run: |
          uv venv /tmp/wheelenv
          uv pip install --python /tmp/wheelenv pytest dist/*.whl
          cp -r python/tests /tmp/sdk-tests
          cd /tmp && /tmp/wheelenv/bin/python -m pytest sdk-tests -q
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheel
          path: dist/*.whl

  commits:
    name: commits (conventional)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      # Every non-merge commit in the PR, and the PR title (ADR-0011).
      - run: uv run --no-project python scripts/conventional_commits.py --pr
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}

  checks:
    name: checks (repo consistency)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      # ADR index and references (ADR-0001).
      - run: uv run --no-project python scripts/check_adr_index.py
      - run: uv run --no-project python scripts/check_adr_refs.py
      # A user-facing change must touch the changelog (ADR-0007).
      - if: github.event_name == 'pull_request'
        run: uv run --no-project python scripts/check_changelog.py --pr
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

  msrv:
    name: msrv (rust 1.90)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.90.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo check --all --all-features

  deny:
    name: deny (offline core, licences)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # bans: no network-capable or async-runtime crate may enter the tree
      # (ADR-0004, deny.toml). licenses/advisories/sources: the rest of what
      # cargo-deny checks, all four in one run.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

  coverage:
    name: coverage (report only, no gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
        with:
          tool: cargo-llvm-cov
      # mnem-py excluded, same reason as every other job: its test binary
      # needs libpython to link. A report, not a gate - no failing threshold
      # here; that's a separate policy decision, not bundled into this one.
      - run: cargo llvm-cov --workspace --exclude mnem-py --html
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: target/llvm-cov/html
