# Path-based PR labels (actions/labeler v5). See .github/workflows/labeler.yml.
# A PR can pick up several; that is fine.

track-a:
  - changed-files:
      - any-glob-to-any-file:
          - "crates/mnem-store/**"
          - "crates/mnem-git/**"
          - "deny.toml"

track-b:
  - changed-files:
      - any-glob-to-any-file:
          - "crates/mnem-py/**"
          - "python/**"
          - "pyproject.toml"

format:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/format/**"
          - "crates/mnem-store/src/codec.rs"
          - "crates/mnem-store/src/id.rs"
          - "crates/mnem-store/src/object.rs"

adr:
  - changed-files:
      - any-glob-to-any-file:
          - "docs/adr/**"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"
