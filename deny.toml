# cargo-deny configuration.
#
# The `deny` CI job runs `cargo deny check`: bans, licences, advisories and
# sources, all four. Bans is the one ADR-0004 promises: no network-capable,
# TLS or async-runtime crate may enter the workspace dependency tree.
# `mnem-store` is offline and model-free, and the `mnem` CLI and the
# `mnem-py` binding are held to the same bar.

[graph]
all-features = true

[licenses]
# Every permissive, OSI-approved licence actually in the dependency tree.
# `cargo deny check licenses` lists exactly what to add here if a new
# dependency brings something not already allowed.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "Unicode-3.0",
  "CC0-1.0",
  "MIT-0",
  "Unlicense",
]
confidence-threshold = 0.8

[advisories]
# No known-vulnerable dependency has ever needed acknowledging; this stays
# empty until one does, rather than relying on cargo-deny's implicit default.
ignore = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[bans]
multiple-versions = "allow"
wildcards = "allow"

# Deny by name. If a legitimate need for one of these ever appears (a daemon,
# a remote sync in Era 2) it gets its own ADR and a scoped exception here.
deny = [
  { name = "tokio", reason = "async runtime; the substrate is synchronous and offline" },
  { name = "async-std", reason = "async runtime" },
  { name = "smol", reason = "async runtime" },
  { name = "reqwest", reason = "HTTP client" },
  { name = "hyper", reason = "HTTP" },
  { name = "h2", reason = "HTTP/2" },
  { name = "ureq", reason = "HTTP client" },
  { name = "isahc", reason = "HTTP client" },
  { name = "surf", reason = "HTTP client" },
  { name = "curl", reason = "HTTP client" },
  { name = "curl-sys", reason = "HTTP client" },
  { name = "native-tls", reason = "TLS" },
  { name = "openssl", reason = "TLS" },
  { name = "openssl-sys", reason = "TLS" },
  { name = "rustls", reason = "TLS" },
  { name = "tokio-rustls", reason = "TLS" },
  { name = "hyper-tls", reason = "TLS" },
  { name = "quinn", reason = "QUIC" },
  { name = "tonic", reason = "gRPC" },
  { name = "socket2", reason = "raw sockets" },
]
