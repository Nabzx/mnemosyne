[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mnem-mcp"
version = "0.0.1"
description = "MCP server for Mnemosyne: an AI agent's memory as tools and resources."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Nabil Shah", email = "nabilshahx@gmail.com" }]
keywords = ["ai", "agents", "memory", "mcp", "model-context-protocol"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "mnem-agents ~= 0.0",
    "mcp >= 2.2, < 3",
]

[project.scripts]
mnem-mcp = "mnem_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/Nabzx/mnemosyne"
Repository = "https://github.com/Nabzx/mnemosyne"
Documentation = "https://nabzx.github.io/mnemosyne/"

[project.optional-dependencies]
dev = ["pytest >= 8", "ruff >= 0.6"]

# The SDK is not on PyPI yet; take it from the repo root.
[tool.uv.sources]
mnem-agents = { path = "../..", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["mnem_mcp"]

[tool.ruff]
line-length = 100
