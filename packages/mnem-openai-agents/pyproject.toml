[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mnem-openai-agents"
version = "0.0.1"
description = "OpenAI Agents SDK Session backed by Mnemosyne: versioned agent memory with blame and bisect."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Nabil Shah", email = "nabilshahx@gmail.com" }]
keywords = ["ai", "agents", "memory", "openai-agents", "version-control"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "mnem-agents ~= 0.0",
    "openai-agents >= 0.20, < 1",
]

[project.urls]
Homepage = "https://github.com/Nabzx/mnemosyne"
Repository = "https://github.com/Nabzx/mnemosyne"
Documentation = "https://nabzx.github.io/mnemosyne/"

[project.optional-dependencies]
dev = ["pytest >= 8", "ruff >= 0.6"]

# The SDK is not on PyPI yet; take it from the repo root.
[tool.uv.sources]
mnem-agents = { path = "../..", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["mnem_openai_agents"]

[tool.ruff]
line-length = 100
