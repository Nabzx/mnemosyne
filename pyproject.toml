[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "mnem-agents"
description = "Version control for AI agent memory. Python SDK for Mnemosyne."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Nabil Shah", email = "nabilshahx@gmail.com" }]
keywords = ["ai", "agents", "memory", "version-control", "provenance"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Version Control",
]
dependencies = []
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/Nabzx/mnemosyne"
Repository = "https://github.com/Nabzx/mnemosyne"
Documentation = "https://nabzx.github.io/mnemosyne/"
Issues = "https://github.com/Nabzx/mnemosyne/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.maturin]
# One version number, held in the Cargo workspace and read into the wheel at
# build time (ADR-0004).
manifest-path = "crates/mnem-py/Cargo.toml"
module-name = "mnem._mnem"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.ruff]
line-length = 100
src = ["python", "scripts"]
