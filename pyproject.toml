[project]
name = "mnemosyne-agents"
version = "0.0.1"
description = "Version control for AI agent memory. Python SDK for Mnemosyne."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Nabil Shah", email = "nabilshahx@gmail.com" }]
keywords = ["ai", "agents", "memory", "version-control", "provenance"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Version Control",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Nabzx/mnemosyne"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/mnem"]

[tool.ruff]
line-length = 100
src = ["python"]
