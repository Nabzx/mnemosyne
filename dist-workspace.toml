[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Trigger the release workflow by hand (`gh workflow run` / the Actions tab),
# not on every tag push. This project tags and creates the GitHub Release by
# hand (ADR-0007); this keeps that the trigger for everything, dist included.
dispatch-releases = true
# Assume the GitHub Release for the tag already exists (as a draft) rather
# than have dist create it. dist uploads the binaries to that draft and
# undrafts it once everything is attached, so the release only goes visible
# once the artifacts are actually there.
create-release = false
