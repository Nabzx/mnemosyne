<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 356" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <rect x="1" y="1" width="878" height="354" rx="11" fill="#0b0e14" stroke="#222831"/>
  <circle cx="26" cy="24" r="5.5" fill="#ff5f56"/>
  <circle cx="46" cy="24" r="5.5" fill="#ffbd2e"/>
  <circle cx="66" cy="24" r="5.5" fill="#27c93f"/>
  <text x="440" y="28" text-anchor="middle" fill="#6b7280" font-size="12">record — commit, provenance, log, time-travel</text>
  <line x1="0" y1="45" x2="880" y2="45" stroke="#191e27"/>

  <g xml:space="preserve">
    <text x="24" y="76"><tspan fill="#3fb950">$ </tspan><tspan fill="#c9d1d9">mnem add customer-4821 </tspan><tspan fill="#a5d6ff">"on the Enterprise plan"</tspan><tspan fill="#c9d1d9"> --source </tspan><tspan fill="#a5d6ff">ticket-4821</tspan></text>
    <text x="24" y="97"><tspan fill="#8b949e">  Staged </tspan><tspan fill="#79c0ff">customer-4821</tspan><tspan fill="#8b949e"> as 9f2c1a7b4e08</tspan></text>

    <text x="24" y="139"><tspan fill="#3fb950">$ </tspan><tspan fill="#c9d1d9">mnem commit -m </tspan><tspan fill="#a5d6ff">"open the case"</tspan><tspan fill="#c9d1d9"> --author support-agent</tspan></text>
    <text x="24" y="160"><tspan fill="#3fb950">  [a17e42c9]</tspan><tspan fill="#c9d1d9"> open the case</tspan></text>

    <text x="24" y="202"><tspan fill="#3fb950">$ </tspan><tspan fill="#c9d1d9">mnem log --oneline</tspan></text>
    <text x="24" y="223"><tspan fill="#79c0ff">  a17e42c9</tspan><tspan fill="#c9d1d9">  open the case</tspan></text>
    <text x="24" y="244"><tspan fill="#79c0ff">  2b90f1de</tspan><tspan fill="#c9d1d9">  initialise the account</tspan></text>

    <text x="24" y="286"><tspan fill="#3fb950">$ </tspan><tspan fill="#c9d1d9">mnem show a17e42c9</tspan><tspan fill="#6e7681">        # memory exactly as it stood then</tspan></text>
    <text x="24" y="307"><tspan fill="#79c0ff">  customer-4821</tspan><tspan fill="#a5d6ff">  "on the Enterprise plan"</tspan></text>
    <text x="24" y="328"><tspan fill="#79c0ff">  case-4821</tspan><tspan fill="#a5d6ff">      "billing dispute — investigating"</tspan></text>
  </g>
</svg>
