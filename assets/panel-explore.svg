<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 462" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <rect x="1" y="1" width="878" height="460" rx="11" fill="#0b0e14" stroke="#222831"/>
  <circle cx="26" cy="24" r="5.5" fill="#ff5f56"/>
  <circle cx="46" cy="24" r="5.5" fill="#ffbd2e"/>
  <circle cx="66" cy="24" r="5.5" fill="#27c93f"/>
  <text x="440" y="28" text-anchor="middle" fill="#6b7280" font-size="12">explore — branch a hypothesis, diff it, merge it back</text>
  <line x1="0" y1="45" x2="880" y2="45" stroke="#191e27"/>

  <g xml:space="preserve">
    <text x="24" y="76"><tspan fill="#3fb950">$ </tspan><tspan fill="#c9d1d9">mnem checkout -b assume-downgrade</tspan></text>
    <text x="24" y="97"><tspan fill="#8b949e">  Switched to branch </tspan><tspan fill="#bc8cff">'assume-downgrade'</tspan></text>

    <text x="24" y="139"><tspan fill="#3fb950">$ </tspan><tspan fill="#c9d1d9">mnem add customer-4821 </tspan><tspan fill="#a5d6ff">"downgraded to Pro last month"</tspan></text>
    <text x="24" y="160"><tspan fill="#3fb950">$ </tspan><tspan fill="#c9d1d9">mnem diff</tspan></text>
    <text x="24" y="181"><tspan fill="#d29922">  ~ customer-4821</tspan></text>
    <text x="24" y="202"><tspan fill="#f85149">    - "on the Enterprise plan"</tspan></text>
    <text x="24" y="223"><tspan fill="#3fb950">    + "downgraded to Pro last month"</tspan></text>

    <text x="24" y="265"><tspan fill="#3fb950">$ </tspan><tspan fill="#c9d1d9">mnem checkout main  &amp;&amp;  mnem merge assume-downgrade</tspan></text>
    <text x="24" y="286"><tspan fill="#f85149">  Merge conflict in 1 node(s):</tspan></text>
    <text x="24" y="307"><tspan fill="#c9d1d9">    customer-4821 </tspan><tspan fill="#8b949e">(edit/edit)</tspan></text>
    <text x="24" y="328"><tspan fill="#8b949e">      ours:    </tspan><tspan fill="#a5d6ff">"on the Enterprise plan"</tspan></text>
    <text x="24" y="349"><tspan fill="#8b949e">      theirs:  </tspan><tspan fill="#a5d6ff">"downgraded to Pro last month"</tspan></text>

    <text x="24" y="391"><tspan fill="#3fb950">$ </tspan><tspan fill="#c9d1d9">mnem merge assume-downgrade --resolve customer-4821=theirs</tspan></text>
    <text x="24" y="412"><tspan fill="#3fb950">  [7a1c9e04]</tspan><tspan fill="#c9d1d9"> merge assume-downgrade into main</tspan></text>
  </g>
</svg>
