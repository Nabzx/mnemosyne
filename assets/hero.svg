<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1018"/>
      <stop offset="1" stop-color="#080b10"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f0883e"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="938" height="428" rx="14" fill="url(#bg)" stroke="#20262f"/>

  <text x="36" y="48" fill="#e6edf3" font-size="22" font-weight="700">Mnemosyne</text>
  <text x="36" y="72" fill="#8b949e" font-size="13">an AI agent's memory, under version control&#8202;&#8202;·&#8202;&#8202;local, deterministic, no model calls</text>

  <!-- memory chips: what the agent knows at the highlighted commit -->
  <text x="36" y="112" fill="#6e7681" font-size="10.5">MEMORY, AT THIS COMMIT</text>
  <g font-size="10.5">
    <rect x="36" y="120" width="210" height="24" rx="5" fill="#0f1c29" stroke="#1f3b52"/>
    <text x="48" y="136" fill="#79c0ff">customer-4821</text>
    <text x="234" y="136" fill="#adbac7" text-anchor="end">Enterprise plan</text>
    <rect x="36" y="148" width="210" height="24" rx="5" fill="#0f1c29" stroke="#1f3b52"/>
    <text x="48" y="164" fill="#79c0ff">case-4821</text>
    <text x="234" y="164" fill="#adbac7" text-anchor="end">billing dispute</text>
  </g>
  <path d="M246 132 C 270 132, 285 190, 300 202" stroke="#1f3b52" stroke-width="1.4" fill="none"/>

  <!-- lane labels -->
  <text x="36" y="246" fill="#6e7681" font-size="11.5">main</text>
  <text x="36" y="330" fill="#6e7681" font-size="11.5">hypothesis</text>

  <!-- edges -->
  <g fill="none" stroke="#2b3138" stroke-width="2.5">
    <path d="M110 240 H300"/>
    <path d="M300 240 H600"/>
    <path d="M600 240 H710"/>
    <path d="M710 240 H835"/>
    <path d="M300 240 C 344 240, 356 320, 400 320"/>
    <path d="M400 320 H545"/>
    <path d="M545 320 C 618 320, 640 240, 710 240"/>
  </g>

  <!-- commit nodes -->
  <circle cx="110" cy="240" r="8" fill="#58a6ff"/>
  <circle cx="300" cy="240" r="8.5" fill="#58a6ff" stroke="#e6edf3" stroke-width="1.5"/>
  <circle cx="600" cy="240" r="8" fill="#58a6ff"/>
  <circle cx="710" cy="240" r="10" fill="#3fb950"/>
  <circle cx="835" cy="240" r="8" fill="#58a6ff"/>
  <circle cx="400" cy="320" r="8" fill="#bc8cff"/>
  <circle cx="545" cy="320" r="8" fill="#bc8cff"/>

  <!-- commit labels -->
  <g fill="#8b949e" font-size="11" text-anchor="middle">
    <text x="110" y="216">open the case</text>
    <text x="300" y="216">learn the plan tier</text>
    <text x="600" y="216">add a contact</text>
    <text x="710" y="212" fill="#3fb950" font-weight="700">merge</text>
    <text x="835" y="216">escalate</text>
    <text x="400" y="348">assume downgrade</text>
    <text x="545" y="348">recheck billing</text>
  </g>

  <!-- blame callout -->
  <g font-size="10.5">
    <rect x="558" y="96" width="356" height="52" rx="7" fill="#1c1206" stroke="#5c3a17"/>
    <text x="572" y="116" fill="#f0883e" font-weight="700">blame  customer-4821</text>
    <text x="572" y="134" fill="#c9d1d9">"downgraded to Pro"  ←  billing-note-8842 · step 31</text>
    <path d="M568 148 C 500 220, 460 270, 412 306" stroke="#f0883e" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  </g>

  <!-- bisect marker -->
  <circle cx="400" cy="320" r="16" fill="none" stroke="#f0883e" stroke-width="1.6"/>
  <line x1="412" y1="332" x2="422" y2="342" stroke="#f0883e" stroke-width="2.4" stroke-linecap="round"/>
  <text x="400" y="384" fill="#f0883e" font-size="10.5" text-anchor="middle">bisect — the first commit where the belief went wrong</text>

  <!-- legend -->
  <g font-size="11" fill="#8b949e">
    <circle cx="330" cy="404" r="5" fill="#58a6ff"/><text x="342" y="408">commit</text>
    <circle cx="422" cy="404" r="5" fill="#bc8cff"/><text x="434" y="408">branch</text>
    <circle cx="512" cy="404" r="5" fill="#3fb950"/><text x="524" y="408">merge</text>
    <text x="600" y="408" fill="#6e7681">· time-travel to any commit</text>
  </g>
</svg>
